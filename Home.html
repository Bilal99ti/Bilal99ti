<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamborghini</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: black;
            color: white;
            text-align: center;
        }
        header {
            background: #ffcc00;
            padding: 20px;
            color: black;
            font-size: 24px;
            font-weight: bold;
        }
        .hero {
            background: url('https://source.unsplash.com/1600x900/?lamborghini') no-repeat center center/cover;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
        }
        .section {
            padding: 50px 20px;
        }
        .gallery img {
            width: 50%;
            max-width: 400px;
            margin: 10px;
            border-radius: 10px;
        }
        .contact input, .contact textarea {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }
        .contact button {
            background: #ffcc00;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <header>Lamborghini</header>
    <div class="hero">Luxury. Speed. Power.</div>
    <div class="section">
        <h2>About Lamborghini</h2>
        <p>Lamborghini is an Italian brand known for its high-performance, luxury sports cars.</p>
    </div>
    <div class="section gallery">
        <h2>Lamborghini</h2>
        <img src="https://tse3.mm.bing.net/th?id=OIP.exwFxQRD3J0_i7uPVN20KgHaE8&pid=Api&P=0&h=220" >
        <img src="https://tse3.mm.bing.net/th?id=OIP.jpi2smJHmY0xBfICJ_jjVwHaEK&pid=Api&P=0&h=220" >
    </div>
    <div class="section contact">
        <h2>Contact Us</h2>
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <textarea placeholder="Your Message"></textarea>
        <button>Send Message</button>
    </div>
     
</body>
</html>
